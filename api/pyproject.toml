[project]
name = "coachkg"
version = "0.1.0"
description = "Coach decision support API: knowledge graph, safety filter, workout drafting, copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rdflib>=7.6.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coachkg"]

[tool.uv]
exclude-newer = "2026-10-13T00:00:00Z"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network (EVS, Anthropic); excluded from the default run"]
addopts = "-m 'not live' -q"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
