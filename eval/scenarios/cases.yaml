# Generator scenarios. Checks are deterministic and run against the plan the API returns.
# `member` defaults to Jordan. The brief's three adjustment rows run on members where they change
# the plan, all on Elena, a demo-coach member a reviewer can open: no injury, no deadlift dislike,
# and she owns dumbbells, kettlebells and a barbell with plates and a rack.
- id: brief-exclude-deadlifts
  member: mbr_01HXGEN0005
  prompt: Exclude deadlifts
  expect: { plan: true, no_family: [family:deadlift] }
- id: brief-left-knee
  member: mbr_01HXGEN0005
  prompt: Her left knee is bothering her
  expect: { plan: true, no_region: [region:knee] }
- id: brief-no-barbell
  member: mbr_01HXGEN0005
  prompt: She has no barbell, only dumbbells and a kettlebell
  expect: { plan: true, no_equipment: [Barbell, Flat Bench, Rack, Plate] }
- id: brief-knee-example
  member: mbr_01HXGEN0005
  prompt: lower-body exercises that avoid aggravating a knee injury
  expect: { plan: true, no_region: [region:knee] }
- id: brief-pecs-example
  prompt: full-body exercise with isolation around my pecs
  expect: { plan: true }
- id: deadlift
  prompt: Full body 40 min, no deadlifts.
  expect: { plan: true, no_family: [family:deadlift] }
- id: left-knee
  prompt: 45 minutes, lower body. Her left knee is still a bit sore.
  expect: { plan: true, no_region: [region:knee], no_pattern: [cardio - plyometric], note_contains: main-block exercises match }
# Same request with the coach's structured clearance for Jordan's left knee: low-impact knee work
# comes back down-ranked and flagged; plyometrics stay out.
- id: left-knee-cleared
  prompt: 45 minutes, lower body. Her left knee is still a bit sore.
  cleared_low_impact: [inj_knee_left]
  expect: { plan: true, no_pattern: [cardio - plyometric] }
- id: no-barbell
  prompt: 30 min upper body. She has no barbell and no bench this week.
  expect: { plan: true, no_equipment: [Barbell, Flat Bench] }
- id: no-dumbbells
  prompt: Upper body, 30 minutes, she left her dumbbells at the office.
  expect: { plan: true, no_equipment: [Dumbbell] }
- id: no-match-focus
  prompt: Explosive plyometric jump training, 30 minutes.
  expect: { plan: true, no_pattern: [cardio - plyometric], note_contains: Nothing matching }
- id: no-match-injury
  prompt: Upper body today, her thingy is acting up again.
  expect: { blocked: true }
