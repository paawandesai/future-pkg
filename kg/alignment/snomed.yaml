# SNOMED CT alignments: identifiers and OUR labels only. No SNOMED descriptions, synonyms or
# hierarchy are stored here, not even a hash of a name (a hash of a short name can be reversed).
# tests/test_snomed_live.py resolves every code live and checks that its current name shares a
# word with our label and names the same side, so a wrong or retired code fails the build.
system: http://snomed.info/sct
iri_prefix: http://snomed.info/id/
alignments:
  - { concept: region:knee, side: null, sctid: "49076000", match: exactMatch, our_label: Knee joint }
