# Equipment substitutions. A substitute is offered only for the listed patterns, because a
# swap that works for a goblet hold may not work for a throw or a press.
# Used for ranking and suggestions only, never for safety decisions.
review:
  status: draft
  drafted_by: model
  reviewer: null
  signed_on: null
  # Previously signed by PD on 2026-10-15. Reset to draft on 2026-10-16 after adding the two
  # barbell substitutes. ("car" on the miniband row is the dataset's controlled-articular-rotation
  # pattern, not a typo.)
  basis: Our judgment of load-holding equivalence; no external source.

substitutes:
  - { missing: Kettlebell, use: Dumbbell, patterns: [lower push - squat, lower push - split squat, lower pull - hip hinge, lower pull - hip lift, core - carry] }
  - { missing: Dumbbell, use: Kettlebell, patterns: [lower push - squat, lower push - split squat, lower pull - hip hinge, core - carry] }
  - { missing: Medicine Ball, use: Dumbbell, patterns: [lower push - split squat, lower pull - hip lift] }
  - { missing: Sandbag, use: Kettlebell, patterns: [core - carry] }
  - { missing: Miniband, use: Resistance Band - Loop, patterns: [lower - abduction, car] }
  - { missing: Resistance Band - Loop, use: Miniband, patterns: [lower - abduction] }
  - { missing: Box, use: Flat Bench, patterns: [lower push - step-up] }
  - { missing: Adjustable Bench - Incline, use: Flat Bench, patterns: [upper pull - horizontal], caveat: changes the torso angle }
  - { missing: Barbell, use: Dumbbell, patterns: [lower push - lunge, lower push - step-up, upper push - horizontal, lower pull - hip hinge, lower push - squat], caveat: lighter total load; each hand moves on its own }
  - { missing: Barbell, use: Kettlebell, patterns: [lower push - squat, lower pull - hip hinge, lower push - lunge], caveat: goblet or racked hold instead of a bar on the back }
