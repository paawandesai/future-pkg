# Per-exercise attributes the dataset does not carry, used by the knee rules.
#   loaded_knee_flexion: deepest knee bend while the knee bears body weight or external load
#     none     knee not bearing load in flexion (or extended)
#     shallow  up to about 45 degrees
#     deep     beyond about 45 degrees
#   impact: none | low (walking, stepping) | high (jumps, landings, bounding)
#   extra_stresses: regions the dataset's joints_loaded omits (documented gaps)
# Keyed by exercise name; the loader fails if a name is not in the catalog or kg/authored.
review:
  status: draft
  drafted_by: model
  reviewer: null
  signed_on: null
  basis: >-
    Knee-angle bands follow the 0-45 degree range used in patellofemoral pain guidance
    (Powers et al. 2014; Escamilla et al. 2022, see contraindications.yaml). Classification of
    each exercise is a judgment from its name and movement pattern and needs a coach's review.

exercises:
  Barbell Decline Bench Press: { loaded_knee_flexion: none, impact: none }
  Push-Up to Knee-Drive: { loaded_knee_flexion: none, impact: low }
  Alternating Dumbbell Decline Bench Press: { loaded_knee_flexion: none, impact: none }
