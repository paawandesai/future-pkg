# Extra labels (skos:altLabel) for concepts, so coach shorthand resolves: "pecs", "DBs", "KB".
# Keyed by concept kind, then by the concept's preferred label (as in the dataset or rule files).
#
# Not a rule file and not signed: a label only maps text onto a concept. It can't make anything
# allowed. Equipment the member owns comes from the member record, not from these labels, and an
# injury mention that resolves through a label still restricts exactly like the preferred term.
# The loader fails on a label for a concept that doesn't exist, or one label on two concepts.

muscle:
  chest: [pecs, pec, pecs major, pectorals, pectoralis, pectoralis major]
  core: [abs, abdominals, ab, six pack, midsection, trunk]
  obliques: [side abs, oblique]
  quads: [quadriceps, quad, thighs, front of thigh]
  hamstrings: [hammies, hammy, hamstring, back of thigh]
  glutes: [glute, butt, bum, gluteus, gluteus maximus, glute max, gluteals]
  calves: [calf, calf muscle, gastrocnemius, soleus]
  biceps: [bicep, bis, guns]
  triceps: [tricep, tris]
  deltoids: [delts, delt, deltoid, shoulder muscles]
  lats: [lat, latissimus, latissimus dorsi]
  traps: [trap, trapezius]
  forearms: [forearm, grip]
  rotator cuff: [cuff, rotator cuff muscles]
  hip adductors: [adductors, adductor, inner thigh, groin]
  hip flexors: [hip flexor, psoas, iliopsoas]
  lower back: [erectors, spinal erectors, erector spinae]
  middle back: [mid-back muscles, rhomboids]
  upper back: [upper-back muscles]

equipment:
  Dumbbell: [DB, DBs, dumbbells, dumbells, dumbbell pair]
  Kettlebell: [KB, KBs, kettlebells, kettle bell]
  Barbell: [BB, barbells, olympic bar]
  EZ Bar: [EZ curl bar, curl bar, ez-bar]
  Resistance Band - Loop: [loop band, booty band, band loop]
  Resistance Band - With Handles: [tube band, band with handles]
  Miniband: [mini band, mini-band, hip circle]
  Pull-Up Bar: [pullup bar, chin-up bar, chinup bar]
  Medicine Ball: [med ball, medball]
  Stability Ball: [swiss ball, exercise ball, physio ball]
  Suspension Trainer: [TRX, suspension straps]
  Yoga Mat: [mat, exercise mat]
  Flat Bench: [bench, weight bench]
  Cable Resistance Machine: [cable machine, cables, cable stack]
  Jump Rope: [skipping rope, rope]
  Rack: [squat rack, power rack]
  Box: [plyo box, step, step box]

# Region labels also cover common injury and coach words that name a place without naming the
# joint ("ACL", "achilles", "sciatica"). They only point text at a region, so an injury mention
# that uses them restricts that region; nothing here can lift a restriction. A word with no
# joint in the catalog (foot, shin) points at the nearest joint the catalog loads.
region:
  Lumbar spine:
    - lumbar
    - lumbar back
    - sciatica
    - sciatic nerve
    - disc
    - discs
    - disk
    - herniated disc
    - slipped disc
    - bulging disc
    - L4
    - L5
    - S1
    - L5-S1
    - SI joint
    - sacroiliac
    - sacroiliac joint
    - sacrum
    - tailbone
    - coccyx
  Thoracic spine: [thoracic, t-spine, rib, ribs, rib cage]
  Cervical spine: [c-spine, cervical, whiplash]
  Lower limb: [lower-body, lower half]
  Upper limb: [upper-body]
  Knee:
    - ACL
    - MCL
    - PCL
    - LCL
    - anterior cruciate ligament
    - cruciate
    - cruciate ligament
    - IT band
    - ITB
    - iliotibial band
    - IT band syndrome
  Patella: [patellar, patellar tendon, patella tendon]
  Ankle:
    - achilles
    - achilles tendon
    - heel
    - heels
    - foot
    - feet
    - toe
    - toes
    - plantar fascia
    - plantar fasciitis
    - shin
    - shins
    - shin splints
    - lower leg
  Wrist: [carpal tunnel, hand, hands, thumb, finger, fingers]
  Elbow: [epicondylitis, epicondyle]
  Shoulder:
    - impingement
    - AC joint
    - collarbone
    - collar bone
    - clavicle
    - shoulder blade
    - scapula
    - labrum
  Hip: [pelvis, hip bone]
